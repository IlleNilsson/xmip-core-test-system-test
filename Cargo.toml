[package]
name = "xmip-core-test-system-test"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-test-system-test"
description = "The Xmip System Tests: spawns Development nodes as processes and exercises every transport and content contract through them, continuously."
publish.workspace = true

[lib]
path = "src/lib.rs"

# Every System Process Xmip owns is named xmip-<what> (ADR-0053), so one line
# finds them all and none is mistaken for another product's: `node` was
# Node.js's name before it was this one's. The files keep the names of what
# they define.
[[bin]]
name = "xmip-system-test-roll"
path = "src/bin/roll.rs"

# The roll spawns the cluster and the cluster spawns the nodes (the owner,
# 2026-09-19: even clusters have to be spawned as processes during tests).
[[bin]]
name = "xmip-system-test-cluster"
path = "src/bin/cluster.rs"

[[bin]]
name = "xmip-system-test-node"
path = "src/bin/node.rs"

# Each far end outside the cluster, a sender or a receiver, the roll starts
# beside the nodes it runs as xmip-service (the owner's node plan,
# 2026-11-22: the System Tests' far ends, processes of their own).
[[bin]]
name = "xmip-system-test-external"
path = "src/bin/external.rs"

# The System Tests' Work Process unit as its nodes load it:
# `configuration/order-approval.bpmn` generated by `process::generate`, built
# into the library a node opens through the C ABI, against this build's own
# `xmip-core-process`. Built by cargo test and by the System Tests' build
# (Invoke-XmipSystemTestBuild); the run copies it beside each node the
# placement runs it on (`src/served/given.rs`; ADR-0066 clause 4).
[[example]]
name = "order_approval"
path = "examples/order_approval.rs"
crate-type = ["cdylib"]

[dependencies]
# The transports it round-trips over, and the snapshot it publishes verdicts
# into. observe carries Health; transport carries the Transport trait whose
# send/receive is the round trip.
# The declaration every System Process Xmip owns makes of itself (ADR-0053).
node = { workspace = true }
# What the roll, the cluster and every node started, stopped and failed at,
# recorded through the one audit capability (ADR-0062).
xaudit = { workspace = true }
# What each process hands its audit as it starts: the file sink, and the
# operating system's log for when audit cannot persist, the Windows Event
# Log or the local syslog. Each log's crate is empty off its own platform,
# so each is a dependency of its own platform alone, in the target tables
# below (ADR-0062, amendment 2026-11-19).
audit-file = { workspace = true }
observe = { workspace = true }
transport = { workspace = true }
# The Events a node raises and the filters its subscriptions ask by
# (ADR-0065, amendment 2026-09-29).
xevent = { workspace = true }
# The Parties a node's subscriptions are declared as, by name.
party = { workspace = true }
# A node's Subscriptions, taken up from the TOML configuration it binds as a
# real node takes them — read, bound and validated by the runtime, routed by
# route's one publish, paused and resumed through the runtime's pickup
# (ADR-0013, amendment 2026-09-30).
runtime = { workspace = true }
# The run's roster as the cluster's membership, which the runtime's one
# gatherer follows the nodes it reads by (`real.rs`; ADR-0028, amendment
# 2026-11-13); and its `delivery`, the hub each node's subscriptions are
# held by (`eventing.rs`; ADR-0065, amendment 2026-11-13).
xcluster = { workspace = true, default-features = false, features = ["delivery"] }
configure = { workspace = true }
route = { workspace = true }
# What the Parties' documents are routed by, read as a node reads it: the
# `content` route technology over the `edi` path language, made where
# xmip-service makes it (`ContentSource::linked`), so the rig knows the Send
# Port each document it drops is routed to by the product's own routing and
# no second rule (`src/documents.rs`; ADR-0046, amendment 2026-11-11).
route_content = { workspace = true, features = ["edi"] }
# The stamp each document dropped carries, its interchange control
# reference, read and written by Xmip's own `edi` path language, so a drop
# is paired with its arrival by what the document says, whatever its file
# is called where it arrives (`src/carried/stamp.rs`).
path = { workspace = true }
path_edi = { workspace = true }
# The System Tests' Work Process, `configuration/order-approval.bpmn`: read as
# a node's unit is compiled from it, so the rig follows a document through
# it by what the design assigns and no second rule (`src/documents.rs`),
# and its unit, the example `order_approval`, exports what it compiles to
# (ADR-0066 clause 4).
process = { workspace = true }
process_bpmn = { workspace = true }
assign = { workspace = true }
# Where a paused Subscription's pause and what it holds are kept, so both
# survive the node: the node's own embedded Storage node — RocksDB for the
# Ledger, SQLite for the administration database — sealed under a
# key-encryption key of the machine's key store: DPAPI on Windows, a
# private file on Unix, each in its platform's table below. And the Journey
# of a held pair, read back.
persist = { workspace = true }
rocksdb = { workspace = true }
sqlite = { workspace = true }
journey = { workspace = true }
secret = { workspace = true }
# The one refusal of a size over a ceiling (`net::ceiling`).
net = { workspace = true }
# The drop box's far ends (`drop_box/far_ends.rs`): the FTPS servers'
# certificate from the estate's own self-signed source, served and trusted
# through the estate's TLS, and the SFTP servers' host key.
tls = { workspace = true }
provision = { workspace = true }
provision_self_signed = { workspace = true }
ed25519-dalek = "3"

# One technology repository per protocol (ADR-0010), each mounted under the
# transport capability. The RoundTrip adapters drive these.
transport_file = { workspace = true }
transport_tcp = { workspace = true }
transport_udp = { workspace = true }
transport_http = { workspace = true }
transport_smtp = { workspace = true }
transport_websocket = { workspace = true }
transport_mllp = { workspace = true }
transport_modbus = { workspace = true }
transport_bacnet = { workspace = true }
transport_serial = { workspace = true }
transport_can_bus = { workspace = true }
transport_mqtt = { workspace = true }
transport_nats = { workspace = true }
transport_syslog = { workspace = true }
transport_coap = { workspace = true }
transport_dns = { workspace = true }
transport_amqp = { workspace = true }
transport_dnp3 = { workspace = true }
transport_kafka = { workspace = true }
transport_iec_60870_5_104 = { workspace = true }
transport_imap = { workspace = true }
transport_redis_streams = { workspace = true }
transport_pop3 = { workspace = true }
# With its tls feature: the drop box's FTPS (ADR-0028, amendment 2026-10-13).
transport_ftp = { workspace = true, features = ["tls"] }
transport_sftp = { workspace = true }
transport_peppol = { workspace = true }
transport_cotp = { workspace = true }
transport_s7comm = { workspace = true }
transport_secs_gem = { workspace = true }
transport_snmp = { workspace = true }
transport_ssdp = { workspace = true }
transport_mdns = { workspace = true }
transport_dhcp = { workspace = true }
transport_webdav = { workspace = true }
transport_activemq = { workspace = true }
transport_rabbitmq = { workspace = true }
transport_nats_jetstream = { workspace = true }
transport_redpanda = { workspace = true }
transport_postgresql = { workspace = true }
transport_aws_s3 = { workspace = true }
transport_azure_blob = { workspace = true }
transport_google_cloud_storage = { workspace = true }
transport_mssql = { workspace = true }
transport_mariadb = { workspace = true }
transport_mysql = { workspace = true }
transport_oracle = { workspace = true }
transport_db2 = { workspace = true }
# The built that gained their loopback on 2026-09-11 (ADR-0051).
transport_azure_service_bus = { workspace = true }
transport_azure_event_hubs = { workspace = true }
transport_azure_event_grid = { workspace = true }
transport_google_pub_sub = { workspace = true }
transport_j1939 = { workspace = true }
transport_obd_ii = { workspace = true }
transport_uds = { workspace = true }
transport_m_bus = { workspace = true }
transport_wireless_m_bus = { workspace = true }
transport_bluetooth = { workspace = true }
transport_lorawan = { workspace = true }
transport_zigbee = { workspace = true }
transport_thread = { workspace = true }
transport_knx = { workspace = true }
transport_wireless_hart = { workspace = true }
transport_dds = { workspace = true }
transport_ethernet = { workspace = true }
transport_canopen = { workspace = true }
transport_ethercat = { workspace = true }
transport_ethernet_ip = { workspace = true }
transport_profinet = { workspace = true }
transport_io_link = { workspace = true }
transport_iec_61850 = { workspace = true }
transport_nfs = { workspace = true }
transport_smb = { workspace = true }
transport_opc_ua = { workspace = true }
transport_as2 = { workspace = true }
transport_aws_sqs = { workspace = true }
transport_hart = { workspace = true }
transport_sqlite = { workspace = true }
transport_as4 = { workspace = true }
transport_aws_kinesis = { workspace = true }
transport_aws_sns = { workspace = true }
transport_dicom = { workspace = true }
transport_ibm_mq = { workspace = true }
transport_iso_tp = { workspace = true }
transport_msmq = { workspace = true }
transport_named_pipe = { workspace = true }
transport_unix_socket = { workspace = true }

# The content axis: a probe sends an actual Stream, and on arrival a real
# Contract validates it — a pair is delivered only if it round-tripped and the
# contract held. stream carries the immutable content, core the StreamId,
# contract the Contract trait the System Tests' validators implement.
stream = { workspace = true }
xcore = { workspace = true }
contract = { workspace = true }
# A folder of a test's own (`file::temporary`), for the rolls' scenarios and
# the tests here: the System Tests are a test, never in a node.
file = { workspace = true, features = ["test-support"] }
# The varint a protobuf probe is written with.
codec = { workspace = true }
# SQL's string literal, read back once for every far end that answers an
# archive's INSERT with the row it carried.
sql = { workspace = true }
# The MariaDB far end the archive cabinet serves its target from.
library_mariadb = { workspace = true }
# The PostgreSQL far end the remote cabinet serves its archive target from.
library_postgresql = { workspace = true }

# The identity axis: a Receive Location identifies, authenticates and authorizes;
# a Send Location presents identity (ADR-0019, ADR-0033). The System Tests drive
# the estate's real gates with stand-in implementors, so a fault is a real
# Refusal or Decision::Denied, not a fabricated string. context carries the
# AuthenticatedIdentity and IdentityFacts the gates pass between them.
identify = { workspace = true }
authenticate = { workspace = true }
# The gate the far ends prove a node's password through, handed to Xmip's
# SSH and FTP servers as their check (`login`; open problem 59).
authenticate-password = { workspace = true }
# The gate that says whether a key, its signature verified by the SSH
# server, is the user's: the far ends' check for a key (`login`).
authenticate-ssh-key = { workspace = true }
authorize = { workspace = true }
# The policy each node hands its hub, allowing its two Parties to subscribe.
authorize-party = { workspace = true }
context = { workspace = true }

# The retention and archiving axis: the Retention test drives the
# real retention policy (keep, archive, delete by age) and the real archive store
# over a logical clock, so an item's lifecycle is exercised, not mocked.
retain = { workspace = true }
archive = { workspace = true }

# The archive technologies the filing scenario drives, one repository per
# store (ADR-0010), each mounted under the archive capability. Four keep an
# item under a directory; four talk to a server, and the System Tests bind the
# sibling transport's own Session as that server on loopback.
archive_parquet = { workspace = true }
archive_sqlite = { workspace = true }
archive_file = { workspace = true }
archive_sql = { workspace = true }
archive_postgresql = { workspace = true }
archive_aws_s3 = { workspace = true }
archive_azure_blob = { workspace = true }
archive_google_cloud_storage = { workspace = true }
archive_mssql = { workspace = true }
archive_mariadb = { workspace = true }

# The content technologies the probes validate through, so a pair is delivered
# only if the estate's own contract held — not a stand-in parser in the
# System Tests. One repository per contract type (ADR-0010).
contract_json_schema = { workspace = true }
contract_xml_schema = { workspace = true }
contract_csv = { workspace = true }
contract_fixed_width = { workspace = true }
contract_edi_edifact = { workspace = true }
contract_regex = { workspace = true }
contract_schematron = { workspace = true }
contract_hl7_v2 = { workspace = true }
contract_fhir = { workspace = true }
contract_edi_x12 = { workspace = true }
contract_avro = { workspace = true }
contract_protobuf = { workspace = true }
# The protobuf probe is written with the wire format's own encoders, beside
# the walk every protobuf reader in Xmip shares (open-problems.md, 25).
message = { workspace = true }
contract_asyncapi = { workspace = true }
contract_openapi = { workspace = true }
contract_wsdl = { workspace = true }
contract_graphql_schema = { workspace = true }
contract_sql = { workspace = true }

# The snapshot and history files are written in TOML: on disk is TOML across the
# estate, JSON is reserved for memory and the wire (the owner's rule). serde
# derives the shapes; toml serialises them.
serde = { version = "1", features = ["derive"] }
toml = "1.2.1"

# The operating system's log and the key store of each platform (above).
[target.'cfg(windows)'.dependencies]
audit-windows-event-log = { workspace = true }
secret_dpapi = { workspace = true }

[target.'cfg(unix)'.dependencies]
audit-syslog = { workspace = true }
secret_file = { workspace = true }

[features]
# What the crate's programs that spawn its binaries read of a cluster beyond
# a roll's surface (`Cluster::idle_pass`, `Cluster::quick`,
# `exclusive_claim::drained`), and the test cluster's name where nobody named
# one: a test's, never a roll's.
test-support = ["configure/test-support"]

# The tests that spawn this crate's binaries: an integration program, so
# cargo builds the binaries before it and names them in
# `CARGO_BIN_EXE_<name>`, and no test runs cargo. Until 2026-11-04 they were
# unit tests that built the binaries themselves, a second cargo whose
# features differed from the test's, so each rebuilt the runtime beneath it
# and a test waited minutes. The landing runs it with the declared features.
[[test]]
name = "spawned"
path = "tests/spawned/main.rs"
required-features = ["test-support"]

# The crate's timing program (doc/governance/rust-style.md section 5c): a
# plain cargo test leaves it out, and the landing runs it after every other
# test here, alone, one test at a time, so what it measures is its work.
[[test]]
name = "measured"
path = "tests/measured/main.rs"
test = false
required-features = ["test-support"]

[dev-dependencies]
# The test cluster's names, from its `cluster.xmip` (`configure::fixture`).
configure = { workspace = true, features = ["test-support"] }
# The timing program's figure, the fastest of five over its rounds
# (`xcore::latency`). Test-only.
xcore = { workspace = true, features = ["test-support"] }
# The folder of a test whose Event subscriptions audit in it, removed once
# audit's keeper kept their records (`audit_file::temporary`; ADR-0065,
# amendment 2026-11-20). Test-only.
audit-file = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
